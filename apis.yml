aid: honeylove
name: Honeylove
description: >-
  Honeylove Sculptwear Inc. is a Los Angeles-based, venture-backed direct-to-consumer
  apparel brand founded in 2018 that designs and sells shapewear, bras, bodysuits,
  leggings, and intimates engineered with targeted "smart compression" panels that
  support the body without over-squeezing. Sold primarily through its Shopify-powered
  online store at honeylove.com, the company has grown to millions of customers, was
  named to the Inc. 5000 list of fastest-growing private companies, and is backed by
  Lightspeed Venture Partners and Y Combinator. Honeylove operates as a consumer
  e-commerce retailer and does not currently publish a public developer API program;
  this profile captures its public web, policy, and support surface for the API
  Evangelist network.
